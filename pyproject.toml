[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usb_link_check"
version = "0.1.0"
description = "USB 接続のポート / ケーブル / デバイスの能力を推論し、ボトルネックを特定する CLI ツール"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rich",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
usb-link-check = "usb_link_check.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/usb_link_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.coverage.run]
source = ["usb_link_check"]
